<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Меню и покупки</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f4; color: #1f2a1f; padding-bottom: 80px;
  }
  header {
    background: #2e7d32; color: #fff; padding: 14px 16px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: #fff; border-top: 1px solid #ddd; z-index: 10;
  }
  nav button {
    flex: 1; padding: 12px 4px; border: none; background: none;
    font-size: 12px; color: #888; cursor: pointer; font-weight: 500;
  }
  nav button.active { color: #2e7d32; }
  nav button span { display: block; font-size: 20px; margin-bottom: 2px; }
  main { padding: 12px; max-width: 600px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }
  .day {
    background: #fff; border-radius: 12px; margin-bottom: 10px;
    padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .day h3 { margin: 0 0 8px; font-size: 15px; color: #2e7d32; }
  .slot {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-top: 1px solid #eee; font-size: 14px;
  }
  .slot:first-of-type { border-top: none; }
  .slot-label { width: 70px; color: #888; font-size: 13px; flex-shrink: 0; }
  .slot-meal { flex: 1; min-width: 0; }
  .slot-meal.empty { color: #bbb; font-style: italic; }
  .slot button {
    border: none; background: #eef5ee; color: #2e7d32;
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .slot button.del { background: #fdecec; color: #c62828; }
  .item {
    background: #fff; border-radius: 10px; padding: 12px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .item input[type=checkbox] { width: 22px; height: 22px; accent-color: #2e7d32; flex-shrink: 0; }
  .item label { flex: 1; font-size: 15px; cursor: pointer; }
  .item.done label { text-decoration: line-through; color: #aaa; }
  .item .del { border: none; background: none; color: #c62828; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .empty-msg { text-align: center; color: #999; padding: 40px 20px; font-size: 14px; }
  .add-row { display: flex; gap: 8px; margin: 12px 0; }
  .add-row input {
    flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 15px; background: #fff;
  }
  .add-row button {
    padding: 12px 18px; border: none; background: #2e7d32; color: #fff;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .hint { font-size: 12px; color: #999; margin: 4px 0 12px; }
  /* модалка */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 20px; width: 100%;
    max-width: 400px; max-height: 85vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 17px; }
  .modal input, .modal textarea {
    width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 15px; margin-bottom: 10px; font-family: inherit;
  }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .row { display: flex; gap: 8px; }
  .modal .row button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
  .modal .btn-primary { background: #2e7d32; color: #fff; }
  .modal .btn-secondary { background: #eee; color: #333; }
  .badge { background: #2e7d32; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>

<header><h1>🍽️ Меню и покупки</h1></header>

<main>
  <!-- ВКЛАДКА МЕНЮ -->
  <section class="tab active" id="tab-menu">
    <div id="menu-list"></div>
    <p class="hint">Нажмите «+» на слот, чтобы добавить блюдо. Ингредиенты попадут в список покупок.</p>
  </section>

  <!-- ВКЛАДКА ПОКУПОК -->
  <section class="tab" id="tab-shop">
    <div class="add-row">
      <input id="new-item" placeholder="Добавить вручную…" autocomplete="off">
      <button id="add-btn">+</button>
    </div>
    <div id="shop-list"></div>
    <p class="hint" id="shop-hint"></p>
  </section>
</main>

<nav>
  <button class="active" data-tab="menu"><span>📅</span>Меню</button>
  <button data-tab="shop"><span>🛒</span>Покупки<span class="badge" id="shop-badge" style="display:none"></span></button>
</nav>

<!-- МОДАЛКА ДОБАВЛЕНИЯ БЛЮДА -->
<div class="modal-bg" id="meal-modal">
  <div class="modal">
    <h3 id="modal-title">Добавить блюдо</h3>
    <input id="meal-name" placeholder="Название блюда (напр. Омлет)" autocomplete="off">
    <textarea id="meal-ingredients" placeholder="Ингредиенты через запятую&#10;напр. яйца, молоко, сыр"></textarea>
    <div class="row">
      <button class="btn-secondary" id="modal-cancel">Отмена</button>
      <button class="btn-primary" id="modal-save">Сохранить</button>
    </div>
  </div>
</div>

<script>
/* ===== ДАННЫЕ ===== */
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const SLOTS = [['breakfast','Завтрак'],['lunch','Обед'],['dinner','Ужин']];

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let menu = load('menu', {});          // { "Понедельник_breakfast": {name, ingredients:[]} }
let shopManual = load('shopManual', []); // [{id, text, done}]
let shopAutoDone = load('shopAutoDone', []); // имена ингредиентов, которые уже вычеркнуты

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ===== ВКЛАДКИ ===== */
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'shop') renderShop();
  };
});

/* ===== МЕНЮ ===== */
function renderMenu() {
  const list = document.getElementById('menu-list');
  list.innerHTML = '';
  DAYS.forEach(day => {
    const div = document.createElement('div');
    div.className = 'day';
    div.innerHTML = `<h3>${day}</h3>`;
    SLOTS.forEach(([key, label]) => {
      const meal = menu[`${day}_${key}`];
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.innerHTML = `
        <span class="slot-label">${label}</span>
        <span class="slot-meal ${meal ? '' : 'empty'}">${meal ? escapeHtml(meal.name) : '—'}</span>
        <button data-act="edit">${meal ? '✏️' : '+'}</button>
        ${meal ? '<button class="del" data-act="del">✕</button>' : ''}
      `;
      slot.querySelector('[data-act=edit]').onclick = () => openMealModal(day, key, meal);
      const delBtn = slot.querySelector('[data-act=del]');
      if (delBtn) delBtn.onclick = () => {
        if (confirm('Удалить блюдо?')) {
          delete menu[`${day}_${key}`];
          save('menu', menu); renderMenu(); renderShop();
        }
      };
      div.appendChild(slot);
    });
    list.appendChild(div);
  });
}

/* ===== МОДАЛКА ===== */
let editing = null;
function openMealModal(day, key, meal) {
  editing = { day, key };
  document.getElementById('modal-title').textContent = meal ? 'Редактировать блюдо' : 'Добавить блюдо';
  document.getElementById('meal-name').value = meal ? meal.name : '';
  document.getElementById('meal-ingredients').value = meal ? meal.ingredients.join(', ') : '';
  document.getElementById('meal-modal').classList.add('open');
  setTimeout(() => document.getElementById('meal-name').focus(), 50);
}
function closeModal() {
  document.getElementById('meal-modal').classList.remove('open');
  editing = null;
}
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-save').onclick = () => {
  const name = document.getElementById('meal-name').value.trim();
  const ingr = document.getElementById('meal-ingredients').value
    .split(',').map(s => s.trim()).filter(Boolean);
  if (!name) { alert('Введите название блюда'); return; }
  menu[`${editing.day}_${editing.key}`] = { name, ingredients: ingr };
  save('menu', menu);
  closeModal(); renderMenu(); renderShop();
};
document.getElementById('meal-modal').onclick = (e) => {
  if (e.target.id === 'meal-modal') closeModal();
};

/* ===== ПОКУПКИ ===== */
function buildAutoList() {
  const set = new Map(); // ингредиент -> количество упоминаний
  Object.values(menu).forEach(meal => {
    meal.ingredients.forEach(i => set.set(i, (set.get(i) || 0) + 1));
  });
  return [...set.entries()].map(([text, count]) => ({ text, count }));
}

function renderShop() {
  const auto = buildAutoList();
  const list = document.getElementById('shop-list');
  list.innerHTML = '';

  // Автоматические (из блюд)
  if (auto.length) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = '🧾 Из меню:';
    list.appendChild(h);
    auto.forEach(({ text, count }) => {
      const done = shopAutoDone.includes(text);
      list.appendChild(makeItem(text, done, count, () => {
        if (done) shopAutoDone = shopAutoDone.filter(x => x !== text);
        else shopAutoDone.push(text);
        save('shopAutoDone', shopAutoDone); renderShop();
      }, null));
    });
  }

  // Ручные
  if (shopManual.length) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = '✍️ Добавлено вручную:';
    list.appendChild(h);
    shopManual.forEach(item => {
      list.appendChild(makeItem(item.text, item.done, 1, () => {
        item.done = !item.done; save('shopManual', shopManual); renderShop();
      }, () => {
        shopManual = shopManual.filter(x => x.id !== item.id);
        save('shopManual', shopManual); renderShop();
      }));
    });
  }

  if (!auto.length && !shopManual.length) {
    const p = document.createElement('div');
    p.className = 'empty-msg';
    p.textContent = 'Список пуст. Добавьте блюда в меню или позиции вручную.';
    list.appendChild(p);
  }

  // Бейдж с числом невыполненных
  const remainingAuto = auto.filter(a => !shopAutoDone.includes(a.text)).length;
  const remainingManual = shopManual.filter(i => !i.done).length;
  const total = remainingAuto + remainingManual;
  const badge = document.getElementById('shop-badge');
  if (total > 0) { badge.textContent = total; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';

  document.getElementById('shop-hint').textContent = total
    ? `Осталось купить: ${total}`
    : 'Всё куплено 🎉';
}

function makeItem(text, done, count, onToggle, onDelete) {
  const div = document.createElement('div');
  div.className = 'item' + (done ? ' done' : '');
  div.innerHTML = `
    <input type="checkbox" ${done ? 'checked' : ''}>
    <label>${escapeHtml(text)}${count > 1 ? ` <span style="color:#999">×${count}</span>` : ''}</label>
    ${onDelete ? '<button class="del">✕</button>' : ''}
  `;
  div.querySelector('input').onchange = onToggle;
  div.querySelector('label').onclick = onToggle;
  if (onDelete) div.querySelector('.del').onclick = onDelete;
  return div;
}

document.getElementById('add-btn').onclick = () => {
  const input = document.getElementById('new-item');
  const text = input.value.trim();
  if (!text) return;
  shopManual.push({ id: uid(), text, done: false });
  save('shopManual', shopManual);
  input.value = ''; renderShop();
};
document.getElementById('new-item').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('add-btn').click();
});

/* ===== УТИЛИТЫ ===== */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== СТАРТ ===== */
renderMenu();
renderShop();

// Регистрация service worker (только если не file://)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
